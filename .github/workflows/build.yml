name: Build APK

# Сборка запускается автоматически при каждой загрузке в ветку main,
# а также вручную со страницы Actions (кнопка "Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать debug APK
        run: gradle assembleDebug --no-daemon

      - name: Опубликовать APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
